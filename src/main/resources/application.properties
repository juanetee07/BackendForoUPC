spring.application.name=demo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Máximo de conexiones simultáneas que puede abrir el backend
spring.datasource.hikari.maximum-pool-size=5

# Conexiones mínimas que mantiene abiertas en reposo
spring.datasource.hikari.minimum-idle=1

# Tiempo (en milisegundos) antes de cerrar conexiones sobrantes que queden ociosas (30 segundos)
spring.datasource.hikari.idle-timeout=30000

# Tiempo máximo de vida de una conexión en el pool (opcional, ej. 10 minutos)
spring.datasource.hikari.max-lifetime=600000

# Configuración de Swagger
#springdoc.swagger-ui.path=/swagger-ui.html

#springdoc.api-docs.path=/v3/api-docs

#springdoc.api-docs.path=/v3/api-docs

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

#servicios de cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
